#   features: [{static: true, topology: true, neighbor_rank: true, demand_max: true, density5: true, density10%: true, density33%: true, detour: true, centroid: true, route_pct: false, slack: true, node_pct: true, meta: true}]
#   PPO_EPOCHS: [3]
#   CL: [false]
#   SEED: [0, 1, 2]


# --- V2c: conditional insertion-detour for city-2 selection (COND_DETOUR) ----
#   Sibling of V2b. Same rules: SEPARATE batch (own key set -> launcher rule), run
#   AFTER V2_best_set is baked into HP.yaml, no `features` line so it INHERITS the
#   chosen best set. COND_DETOUR conditions the SECOND-node policy on the cost of
#   inserting the chosen first node after each candidate: insert_cost (cheapest-
#   insertion delta) + net_delta (actual change in tour length of the full move).
#   Like COND_RANK it is a model-conditioning toggle, NOT a node feature.
#   NOTE: insertion-specific (the successor edge it scores only matches the
#   `insertion` operator) and supports UPDATE_METHOD valid/free, NOT rm_depot;
#   keep HEURISTIC=insertion and UPDATE_METHOD=valid for this batch.
#   EVAL: uv run eval/run.py --dataset random --FOLDER V2_cond_detour --dim 100 --DATA nazari --OUTER_STEPS 10000 --dtype float16 --no-baseline
