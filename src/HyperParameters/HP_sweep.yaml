# --- V2b: conditional neighbor-rank for city-2 selection (COND_RANK) ---------
#   SEPARATE batch, run AFTER V2_best_set is baked into HP.yaml: it adds the COND_RANK
#   key, so its key set differs from the features-only groups (launcher rule -> on its
#   own). No `features` line here on purpose -> it INHERITS the chosen best set from
#   HP.yaml, so COND_RANK is tested on top of the constructed best feature set.
#   COND_RANK conditions the SECOND-node policy on the bidirectional distance-rank
#   (rank_ij, rank_ji) between each candidate and the chosen first node. It is a
#   model-conditioning toggle, NOT a node feature; swept as a disaggregating column.
#   NOTE: COND_RANK currently supports UPDATE_METHOD valid/free, NOT rm_depot
#   (which compacts depot positions); keep UPDATE_METHOD=valid for this batch.
#   EVAL: uv run eval/run.py --dataset random --FOLDER V2_cond_rank --dim 100 --DATA nazari --OUTER_STEPS 10000 --dtype float16 --no-baseline
# - GROUP: [V2_cond_rank]
