#   PPO_EPOCHS: [3]
#   CL: [false]
#   SEED: [0, 1, 2]


# --- V3c: shared encoder + two heads; concat vs bilinear stage-2 -------------
#   MODEL=shared encodes each node once (h_i) and scores both stages as heads
#   over the shared embeddings; BILINEAR=true replaces the stage-2 concat head
#   with a compatibility score q.k/sqrt(d) (single query-key product, no
#   attention stack). BILINEAR is ignored by MODEL=seq.
#   Two groups, identical key sets (launcher rule):
#     * V3c_seq_ref: the incumbent actor, seed-paired reference — set its
#       GLOBAL_CONTEXT to the V3b winner (it must match HP.yaml).
#     * V3c_shared: the 2x2 {context} x {concat, bilinear} on the new actor.
#   NOTE: if `shared` wins, re-run V3a on the winner before moving on —
#   capacity now includes the encoder, so 32/1 may no longer be optimal.
#   -> bake winners into HP.yaml: MODEL, GLOBAL_CONTEXT, BILINEAR.
# - GROUP: [V3c_seq_ref]
#   MODEL: [seq]
#   GLOBAL_CONTEXT: [False]      # <-- FIX from V3b
#   BILINEAR: [false]           # ignored by seq
#   PPO_EPOCHS: [3]
#   CL: [false]
#   SEED: [0, 1, 2]

# - GROUP: [V3c_shared]
#   MODEL: [shared]
#   GLOBAL_CONTEXT: [false, true]
#   BILINEAR: [false, true]
#   PPO_EPOCHS: [3]
#   CL: [false]
#   SEED: [0, 1, 2]


# --- V3d: logit clipping x learnable temperature (distribution shaping) ------
#   Inherits the winning actor from HP.yaml. These flags add no capacity —
#   they tame the sampling distribution: LOGIT_CLIP bounds logits to C*tanh(l)
#   so the softmax cannot collapse to a near-deterministic choice (0 disables;
#   10 = Kool et al.); LEARNABLE_TEMP divides logits by a trainable
#   tau=exp(theta), one per stage. Judge on Entropy (should stop collapsing)
#   and Average_KL (should stop spiking) IN ADDITION to test min_cost.
#   -> bake winners into HP.yaml: LOGIT_CLIP, LEARNABLE_TEMP.
# - GROUP: [V3d_stab]
#   LOGIT_CLIP: [0.0, 10.0]
#   LEARNABLE_TEMP: [false, true]
#   PPO_EPOCHS: [3]
#   CL: [false]
#   SEED: [0, 1, 2]


