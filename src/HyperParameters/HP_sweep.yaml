# src/HyperParameters/HP_sweep.yaml
# ============================================================================
# Q PROTOCOL — CURRICULUM REDESIGN (replaces the old P0-P9 study)
# ============================================================================
# The old P* result folders were deleted from res/ and the frozen config has
# changed since the P batches ran (V1-V8 winners baked into HP.yaml), so every
# P number is stale. A fresh baseline is mandatory; all curriculum results for
# the paper come from the Q batches below (PAPER_GUIDE.md §10).
#
# WHY A REDESIGN — three flaws in the old warmup curriculum:
#   (1) OVER-PARAMETERIZED: 4 coupled knobs (CL_TYPE, MAX_OUTER_STEPS_CL,
#       MAX_PROB_STEP, STEEP_SIG) tuned by coordinate descent on what P8
#       showed to be a plateau — most of that sweep bought nothing.
#   (2) DISCARDED COMPUTE: the warmup runs full SA (sampling + Metropolis,
#       compressed schedule) but stores NO transitions; at xi=500 vs
#       OUTER_STEPS=100, >80% of all SA steps produced no gradient signal.
#   (3) NO DEPTH COVERAGE: every instance warmed to the SAME depth t_init, so
#       one gradient batch only ever sees a narrow band of the cost spectrum
#       (P9's hypothesis, never tested).
#
# THREE MECHANISMS COMPARED:
#   A. WARMUP RAMP (Q1) — the old mechanism re-validated under the new frozen
#      config: CL_MODE=warmup, CL_RANDOM_DEPTH=false, ramp knobs active.
#   B. STOCHASTIC DEPTH (Q2) — warmup with per-instance depth d_i ~ U{0..xi}
#      and NO ramp (CL_TYPE=lin + MAX_PROB_STEP=1 -> t_init=xi from epoch 1).
#      ONE knob (xi). Fixes flaw (3); mean warmup cost xi/2 steps/epoch.
#   C. PERSISTENT CHAINS (Q3) — CL_MODE=chain: instances + best solutions
#      persist across epochs and search RESUMES from them; a fraction
#      CHAIN_REFRESH=rho of chains is replaced by fresh instances each epoch.
#      Geometric age distribution -> mean resume depth = OUTER_STEPS/rho SA
#      steps (rho 0.05/0.1/0.2 -> 2000/1000/500 at OUTER_STEPS=100), and every
#      batch mixes fresh and deep instances (coverage for free). ZERO warmup
#      compute. ONE knob (rho). Fixes flaws (1)-(3).
#
# HOW TO RUN (unchanged)
#   * Exactly ONE batch uncommented at a time (Q0 below is ACTIVE).
#   * LAUNCHER RULE: every uncommented group must list the EXACT same keys.
#     All Q batches share one key set on purpose: CL, CL_MODE, CL_TYPE,
#     MAX_OUTER_STEPS_CL, MAX_PROB_STEP, STEEP_SIG, CL_RANDOM_DEPTH,
#     CHAIN_REFRESH, EARLY_STOP_AFTER, TEST_OUTER_STEPS, PPO_EPOCHS, SEED.
#   * After a batch: evaluate, pick the lowest MEAN final cost across seeds,
#     write it into the "<-- FIX from QN" placeholders of the next batch.
#     EVAL (per GROUP): uv run eval/run.py --dataset random --FOLDER <GROUP> \
#         --dim 100 --DATA nazari --OUTER_STEPS 10000 --dtype float16 --no-baseline
#
# CONVENTIONS (held constant)
#   PPO_EPOCHS: 3. TEST_OUTER_STEPS: 5000 (pinned -> no model-selection
#   confound). EARLY_STOP_AFTER: 1000 for every CL arm, so no arm can
#   early-stop before epoch 1000 -> comparable training lengths regardless of
#   MAX_PROB_STEP (with CL=false the gate is inactive, as in the old P0).
#   Seeds: 3 exploratory, 5 for baseline/confirmation. Noise floor = pooled
#   seed-to-seed std of THIS protocol's stable arms (per-batch convention —
#   do NOT reuse any P-era floor).
#   DECISION RULE: mean final cost vs the Q0 floor, seed-paired. Ties below
#   the floor -> prefer fewer knobs and less compute (chain < depth < ramp).
# ============================================================================


# --- Q0 (ACTIVE): baseline + fresh noise floor -------------------------------
#   No-CL baseline, 5 seeds, under the CURRENT frozen config. Its pooled std is
#   the significance threshold for every later Q comparison. All CL keys below
#   are ignored when CL=false; they are listed for the launcher rule only.
# - GROUP: [Q0_baseline]
#   CL: [false]
#   CL_MODE: [warmup]           # ignored when CL=false
#   CL_TYPE: [sig]              # ignored
#   MAX_OUTER_STEPS_CL: [250]   # ignored
#   MAX_PROB_STEP: [1000]       # ignored
#   STEEP_SIG: [0.01]           # ignored
#   CL_RANDOM_DEPTH: [false]    # ignored
#   CHAIN_REFRESH: [0.1]        # ignored
#   EARLY_STOP_AFTER: [1000]    # ignored (gate inactive when CL=false)
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2, 3, 4]


# --- Q1: mechanism A — old warmup-ramp winner, re-validated -------------------
#   The P7 winner (sig, xi=250, E=2000, kappa=0.01) rerun under the new frozen
#   config, 5 seeds, seed-paired vs Q0. This is the incumbent the redesign has
#   to beat; if even the old winner no longer clears the Q0 floor, the warmup
#   mechanism itself is a null under the new config.
# - GROUP: [Q1_warmup_ramp]
#   CL: [true]
#   CL_MODE: [warmup]
#   CL_TYPE: [sig]
#   MAX_OUTER_STEPS_CL: [250]
#   MAX_PROB_STEP: [2000]
