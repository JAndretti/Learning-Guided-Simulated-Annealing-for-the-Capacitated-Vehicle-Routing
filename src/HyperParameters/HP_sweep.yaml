# --- V2_best_set: CONSTRUCT + CONFIRM the best feature set (5 seeds) ----------
#   The diagnostic groups above only MEASURE impact (LOO = marginal value with all
#   else present; isolation = standalone value over V2_iso_base). This batch is the
#   CONSTRUCTION step: read those results, build CANDIDATE best sets with the rule
#   below, and confirm them seed-paired against the all-on reference.
#   PRUNING RULE (build the candidate set):
#     * keep static + meta (almost always essential);
#     * DROP a feature if its LOO removal changes mean final_cost by < the Batch-0
#       noise floor AND its isolation gain over V2_iso_base is < the noise floor;
#     * for CORRELATED clusters (density5/10%/33%, topology/neighbor_rank, the
#       capacity trio route_pct/slack/node_pct) use the thematic groups: if removing
#       the whole cluster hurts but no single LOO does, keep the best ONE member
#       (highest isolation / cheapest), not all of them.
#   DECISION: pick the set with the lowest mean final_cost that is NOT significantly
#   worse than all-on; on a tie, the SMALLER set wins. BAKE it into HP.yaml `features`
#   before running V2b / V3 (later batches inherit it).
#   EVAL (per folder): uv run eval/run.py --dataset random --FOLDER <GROUP> --dim 100 --DATA nazari --OUTER_STEPS 10000 --dtype float16 --no-baseline
#
#   MULTI-CANDIDATE DESIGN (from the V2 ablation, noise floor sigma~=0.183, 3 seeds):
#   Two decisions are borderline and worth testing empirically rather than trusting
#   the noisy floor: keep `centroid`? (sub-floor LOO +0.098, but iso +0.480) and keep
#   a capacity member `node_pct`? (capacity theme matters +0.343 but no single member
#   does). All candidates share the CORE that passes cleanly:
#       static, meta, topology, neighbor_rank, detour
#   The four candidates below are the 2x2 over {centroid, node_pct}, plus the all-on
#   reference. Density (5/10/33) + demand_max + route_pct + slack are dropped in ALL
#   candidates (density theme removal +0.145 < floor; the other two fail both tests).
#   Read the 5-seed means, then bake the smallest set that is NOT significantly worse
#   than all-on into HP.yaml `features`.
#
# - GROUP: [V2_best_core5]          # CORE only (5): drop centroid AND capacity
#   features: [{static: true, topology: true, neighbor_rank: true, demand_max: false, density5: false, density10%: false, density33%: false, detour: true, centroid: false, route_pct: false, slack: false, node_pct: false, meta: true}]
