# src/HyperParameters/HP_sweep.yaml
# ============================================================================
# Q PROTOCOL — CURRICULUM REDESIGN (replaces the old P0-P9 study)
# ============================================================================
# The old P* result folders were deleted from res/ and the frozen config has
# changed since the P batches ran (V1-V8 winners baked into HP.yaml), so every
# P number is stale. A fresh baseline is mandatory; all curriculum results for
# the paper come from the Q batches below (PAPER_GUIDE.md §10).
#
# WHY A REDESIGN — three flaws in the old warmup curriculum:
#   (1) OVER-PARAMETERIZED: 4 coupled knobs (CL_TYPE, MAX_OUTER_STEPS_CL,
#       MAX_PROB_STEP, STEEP_SIG) tuned by coordinate descent on what P8
#       showed to be a plateau — most of that sweep bought nothing.
#   (2) DISCARDED COMPUTE: the warmup runs full SA (sampling + Metropolis,
#       compressed schedule) but stores NO transitions; at xi=500 vs
#       OUTER_STEPS=100, >80% of all SA steps produced no gradient signal.
#   (3) NO DEPTH COVERAGE: every instance warmed to the SAME depth t_init, so
#       one gradient batch only ever sees a narrow band of the cost spectrum
#       (P9's hypothesis, never tested).
#
# THREE MECHANISMS COMPARED:
#   A. WARMUP RAMP (Q1) — the old mechanism re-validated under the new frozen
#      config: CL_MODE=warmup, CL_RANDOM_DEPTH=false, ramp knobs active.
#   B. STOCHASTIC DEPTH (Q2) — warmup with per-instance depth d_i ~ U{0..xi}
#      and NO ramp (CL_TYPE=lin + MAX_PROB_STEP=1 -> t_init=xi from epoch 1).
#      ONE knob (xi). Fixes flaw (3); mean EFFECTIVE depth xi/2 steps/epoch —
#      but NOT half the cost: depth is applied by masking acceptance past d_i,
#      so all xi loop iterations still run (see Q4). Cost == uniform warmup.
#   C. PERSISTENT CHAINS (Q3) — CL_MODE=chain: instances + best solutions
#      persist across epochs and search RESUMES from them; a fraction
#      CHAIN_REFRESH=rho of chains is replaced by fresh instances each epoch.
#      Geometric age distribution -> mean resume depth = OUTER_STEPS/rho SA
#      steps (rho 0.05/0.1/0.2 -> 4000/2000/1000 at the FROZEN OUTER_STEPS=200;
#      the 2000/1000/500 figures assumed the pre-X3 value of 100), and every
#      batch mixes fresh and deep instances (coverage for free). ZERO warmup
#      compute. ONE knob (rho). Fixes flaws (1)-(3).
#
# HOW TO RUN (unchanged)
#   * Exactly ONE batch uncommented at a time (Q0 below is ACTIVE).
#   * LAUNCHER RULE: every uncommented group must list the EXACT same keys.
#     All Q batches share one key set on purpose: CL, CL_MODE, CL_TYPE,
#     MAX_OUTER_STEPS_CL, MAX_PROB_STEP, STEEP_SIG, CL_RANDOM_DEPTH,
#     CHAIN_REFRESH, EARLY_STOP_AFTER, TEST_OUTER_STEPS, PPO_EPOCHS, SEED.
#   * After a batch: evaluate, pick the lowest MEAN final cost across seeds,
#     write it into the "<-- FIX from QN" placeholders of the next batch.
#     EVAL (per GROUP): uv run eval/run.py --dataset random --FOLDER <GROUP> \
#         --dim 100 --DATA nazari --OUTER_STEPS 10000 --dtype float16 --no-baseline
#
# CONVENTIONS (held constant)
#   PPO_EPOCHS: 3. TEST_OUTER_STEPS: 5000 (pinned -> no model-selection
#   confound). EARLY_STOP_AFTER: 1000 for every CL arm, so no arm can
#   early-stop before epoch 1000 -> comparable training lengths regardless of
#   MAX_PROB_STEP (with CL=false the gate is inactive, as in the old P0).
#   Seeds: 3 exploratory, 5 for baseline/confirmation. Noise floor = pooled
#   seed-to-seed std of THIS protocol's stable arms (per-batch convention —
#   do NOT reuse any P-era floor).
#   DECISION RULE: mean final cost vs the Q0 floor, seed-paired. Ties below
#   the floor -> prefer fewer knobs, then robustness (unanimity across seeds),
#   then less compute. NB the compute ordering "chain < depth < ramp" is WRONG:
#   stochastic depth costs the same as the ramp (masking, see Q2/Q4), so only
#   chain is genuinely cheaper — and chain lost outright.
# ============================================================================


# --- Q0 (ACTIVE): baseline + fresh noise floor -------------------------------
#   No-CL baseline, 5 seeds, under the CURRENT frozen config. Its pooled std is
#   the significance threshold for every later Q comparison. All CL keys below
#   are ignored when CL=false; they are listed for the launcher rule only.
# - GROUP: [Q0_baseline]
#   CL: [false]
#   CL_MODE: [warmup]           # ignored when CL=false
#   CL_TYPE: [sig]              # ignored
#   MAX_OUTER_STEPS_CL: [250]   # ignored
#   MAX_PROB_STEP: [1000]       # ignored
#   STEEP_SIG: [0.01]           # ignored
#   CL_RANDOM_DEPTH: [false]    # ignored
#   CHAIN_REFRESH: [0.1]        # ignored
#   EARLY_STOP_AFTER: [1000]    # ignored (gate inactive when CL=false)
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2, 3, 4]


# --- Q1: mechanism A — old warmup-ramp winner, re-validated -------------------
#   The P7 winner (sig, xi=250, E=2000, kappa=0.01) rerun under the new frozen
#   config, 5 seeds, seed-paired vs Q0. This is the incumbent the redesign has
#   to beat; if even the old winner no longer clears the Q0 floor, the warmup
#   mechanism itself is a null under the new config.
# - GROUP: [Q1_warmup_ramp]
#   CL: [true]
#   CL_MODE: [warmup]
#   CL_TYPE: [sig]
#   MAX_OUTER_STEPS_CL: [250]
#   MAX_PROB_STEP: [2000]
#   STEEP_SIG: [0.01]
#   CL_RANDOM_DEPTH: [false]
#   CHAIN_REFRESH: [0.1]        # ignored in warmup mode
#   EARLY_STOP_AFTER: [1000]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2, 3, 4]


# --- Q2: mechanism B — stochastic warmup depth, no ramp -----------------------
#   d_i ~ U{0..xi} per instance; CL_TYPE=lin + MAX_PROB_STEP=1 kill the ramp
#   (t_init=xi from epoch 1), so xi is the ONLY knob. Sweep it. Mean warmup
#   compute is xi/2 steps/epoch (vs xi for the same arm without random depth).
# - GROUP: [Q2_depth]
#   CL: [true]
#   CL_MODE: [warmup]
#   CL_TYPE: [lin]
#   MAX_OUTER_STEPS_CL: [250, 500, 1000]
#   MAX_PROB_STEP: [1]          # no ramp: full depth from epoch 1
#   STEEP_SIG: [0.01]           # ignored by lin
#   CL_RANDOM_DEPTH: [true]
#   CHAIN_REFRESH: [0.1]        # ignored in warmup mode
#   EARLY_STOP_AFTER: [1000]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]

# --- Q3: mechanism C — persistent chains --------------------------------------
#   RESULT: REJECTED. All 9 runs significantly worse than Q0, unanimous, zero
#   responders (Delta +0.25 to +0.52). The sweep is monotone in the HELPFUL
#   direction — more refresh (less chaining) recovers performance, and rho=1 IS
#   Q0 by construction — so the mechanism should be dropped, not tuned.
#
#   Instances + best solutions persist across epochs; rho = fraction refreshed
#   per epoch. Mean resume depth = OUTER_STEPS/rho SA steps -> 4000/2000/1000 at
#   the frozen OUTER_STEPS=200 (the spec assumed 100, hence "2000/1000/500").
#   That means the arms do NOT bracket the Q2 xi range (125-500) as intended:
#   the two mechanisms span DISJOINT depths, so depth and mechanism cannot be
#   separated from this data. rho in {0.4, 0.8} (depths 500/250) would overlap
#   Q2 if the depth hypothesis is ever worth testing directly.
#   Compute is IDENTICAL to the Q0 baseline (no warmup at all), so any gain
#   would have been free — it still lost.
# - GROUP: [Q3_chain]
#   CL: [true]
#   CL_MODE: [chain]
#   CL_TYPE: [sig]              # ignored in chain mode
#   MAX_OUTER_STEPS_CL: [250]   # ignored (keep ONE value: a 2nd doubles the runs)
#   MAX_PROB_STEP: [1000]       # ignored (early stop uses EARLY_STOP_AFTER)
#   STEEP_SIG: [0.01]           # ignored
#   CL_RANDOM_DEPTH: [false]    # ignored
#   CHAIN_REFRESH: [0.05, 0.1, 0.2]
#   EARLY_STOP_AFTER: [1000]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]

# --- Q4: coverage ablation — is Q2's gain the DEPTH MIX or just the warmup? ---
#   GATE PASSED: the Q2 winner is xi*=250 (Delta -0.0368 vs the Q0 floor 0.0298,
#   unanimous over 3 seeds), so this ablation runs.
#
#   CONSTANT depth for every instance (CL_RANDOM_DEPTH=false) against Q2's
#   d_i ~ U{0..250}. TWO arms, because "budget-matched" is ambiguous here:
#   random depth is implemented by MASKING acceptance past d_i (main.py:366,
#   sa_train.py:402) — every instance still executes all xi loop iterations and
#   frozen ones just discard their moves. So random depth costs the SAME
#   wall-clock as constant depth at the same xi; only the EFFECTIVE depth is
#   xi/2. The two matched controls are therefore different runs:
#     * xi=125 -> EFFECTIVE-depth match. Same mean SA progress applied, zero
#       variance. Differs from Q2 ONLY in the mix -> isolates coverage. This is
#       the control for P9's hypothesis.
#     * xi=250 -> WALL-CLOCK match. Same loop length, i.e. the decision-relevant
#       comparison: given a budget you pay either way, does spreading the depths
#       beat spending it all on uniform depth?
#   Running only one is ambiguous (a 125-only tie cannot separate "coverage is
#   irrelevant" from "mean depth 125 is what mattered"). READING:
#     Q2 ~ Q4@125, both << Q4@250 -> mean depth is everything, mix irrelevant
#     Q2 <  Q4@125                -> COVERAGE IS REAL (P9 confirmed)
#     Q2 ~  Q4@250                -> flat xi=250 is fine, random depth buys nothing
# - GROUP: [Q4_fixed_half]
#   CL: [true]
#   CL_MODE: [warmup]
#   CL_TYPE: [lin]
#   MAX_OUTER_STEPS_CL: [125, 250]   # <-- FIX from Q2 (xi*=250): xi*/2 and xi*
#   MAX_PROB_STEP: [1]          # no ramp
#   STEEP_SIG: [0.01]           # ignored by lin
#   CL_RANDOM_DEPTH: [false]    # constant depth -> no coverage
#   CHAIN_REFRESH: [0.1]        # ignored in warmup mode
#   EARLY_STOP_AFTER: [1000]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]


# --- Q5: confirmation — overall winner at 5 seeds ------------------------------
#   WINNER = Q2 (warmup + stochastic depth, xi=250). Keys below are set to it.
#   Only SEED 3-4 run here: the Q2_depth xi=250 arm is key-for-key IDENTICAL to
#   this config, so seeds 0-2 are REUSED from res/Q2_depth (filter the CSV on
#   MAX_OUTER_STEPS_CL==250) rather than re-run.
#
#   WHY Q2 AND NOT Q1 — this is a TIE-BREAK, not a ranked win. On the shared
#   seeds 0-2, Q1 is actually AHEAD on the mean (16.1804 vs 16.1980), but the
#   0.0176 gap is BELOW the noise floor (0.0298), so they are statistically
#   tied. Q2 is preferred on the header's tie rule (fewer knobs) plus
#   robustness: Q2 is unanimous over its seeds and its LARGEST single-seed gain
#   is exactly seed 0 (-0.0458), the one seed Q1 completely fails to move
#   (+0.0016, a non-responder -> Q1's win is only 4/5). Q2 also drops two
#   hyper-parameters (ramp length E, steepness kappa). NOTE the compute half of
#   the tie rule does NOT apply: masking means Q2 costs the same wall-clock as
#   Q1, and marginally more early (Q1's sigmoid ramp spends < 250 in the opening
#   epochs while Q2 is flat from epoch 1).
#   -> The 5-seed set completed here is what actually settles it: run a
#      seed-paired Q2-vs-Q1 head-to-head at 5v5. Adopt Q2 if it wins or ties
#      with unanimity; fall back to Q1 if it clearly loses.
#   Q3 (chain) is REJECTED outright: all 9 runs significantly worse than Q0,
#   unanimous, zero responders, despite zero warmup compute.
#
#   EXTRA EVALS on these checkpoints (coverage payoff is expected OOD).
#   NB: seeds 0-2 checkpoints live under wandb/LGSA/Q2_depth/, NOT Q5_confirm/,
#   so run each eval against BOTH folders (or copy the 3 checkpoints across)
#   or you will only be measuring seeds 3-4:
#     uv run eval/run.py --dataset random --FOLDER Q5_confirm --dim 50  --DATA nazari --OUTER_STEPS 10000 --dtype float16 --no-baseline
#     uv run eval/run.py --dataset random --FOLDER Q5_confirm --dim 200 --DATA nazari --OUTER_STEPS 10000 --dtype float16 --no-baseline
#     uv run eval/run.py --dataset random --FOLDER Q5_confirm --dim 100 --DATA uchoa  --OUTER_STEPS 10000 --dtype float16 --no-baseline
#   and keep the cost-vs-step curves (not just final cost): the early/high-cost
#   segment is where depth coverage should show up.
# - GROUP: [Q5_confirm]
#   CL: [true]
#   CL_MODE: [warmup]           # <-- FIXED from Q2 (mechanism B won)
#   CL_TYPE: [lin]              # <-- FIXED from Q2 (lin + MAX_PROB_STEP=1 = no ramp)
#   MAX_OUTER_STEPS_CL: [250]   # <-- FIXED from Q2 (winner xi*; 500/1000 rejected)
#   MAX_PROB_STEP: [1]          # <-- FIXED from Q2 (full depth from epoch 1)
#   STEEP_SIG: [0.01]           # ignored by lin
#   CL_RANDOM_DEPTH: [true]     # <-- FIXED from Q2 (the depth mix IS the mechanism)
#   CHAIN_REFRESH: [0.1]        # ignored in warmup mode
#   EARLY_STOP_AFTER: [1000]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [3, 4]                # seeds 0-2 reused from res/Q2_depth (xi=250 arm)



# ============================================================================
# PAPER VALIDATION PROTOCOL — SEQUENTIAL (coordinate descent), Nazari/random
# ============================================================================
# Same philosophy as the curriculum protocol above, but as a CHAIN. Each batch
# sweeps ONE axis; you bake its winner into HP.yaml (the single source of truth)
# before running the next batch, so every later batch inherits all prior winners.
#
# RULES
#   * PPO_EPOCHS = 3 for ALL component batches (V1-V8) to keep training cheap.
#     The impact of PPO_EPOCHS is measured on its own in V9; the final model
#     (V10) then uses the best value.
#   * CL = false for ALL component batches (V1-V9): isolate each component
#     WITHOUT the curriculum confound. Curriculum is validated separately by the
#     Q batches above; the Q5 winner is folded back in only for the final
#     model (V10).
#   * After batch Vn: evaluate (command in each batch), pick the lowest MEAN
#     final_cost over seeds, and IF the winner differs from the current HP.yaml
#     default, WRITE IT INTO HP.yaml before launching V(n+1). That is what
#     "keep the best config and go to the next" means here.
#   * HP.yaml today already encodes the expected optimum (insertion / valid /
#     ff critic / EMBEDDING_DIM=32 / NUM_H_LAYERS=1 / lam / immediate /
#     metropolis / random / route_pct=false), so if a batch's winner matches the
#     default you do not need to change anything.
#   * Launcher rule unchanged: uncomment exactly ONE batch at a time; all of its
#     groups must list the same keys.
#
# ORDER (foundational search mechanics first; the operator must be fixed before
# features mean anything; PPO budget last so it is tuned on the final config):
#   V1 heuristic x feasibility -> V2 features -> V3 actor arch -> V4 critic ->
#   V5 reward -> V6 temperature -> V7 metropolis(train) -> V8 init ->
#   X1 learning rate -> X2 entropy -> X3 SA rollout -> X4 temperature range ->
#   [Q0-Q6 curriculum redesign, above] -> V9 PPO epochs -> V10 FINAL model ->
#   V11 cross-distribution -> V12 cross-dimension.
#
# EVAL PATTERN (Nazari/random; one command per GROUP folder; swept keys appear
# as CSV columns, so a cross-product folder disaggregates by HEURISTIC/REWARD/.):
#   uv run eval/run.py --dataset random --FOLDER <GROUP> --dim 100 \
#       --DATA nazari --OUTER_STEPS 10000 --dtype float16 --no-baseline
#   (drop --no-baseline for the pure-SA row; --augment 8 for x8; --no-metro for
#    the descent test column; --INIT <type> to change the test init.)
# ============================================================================


