# ============================================================================
# V3: ACTOR ARCHITECTURE — sequential sub-protocol (capacity -> structure ->
# shaping). Fixed so far (HP.yaml): operator + feasibility + feature set.
# ============================================================================
# The actor axes are swept in leverage order and each winner is baked into
# HP.yaml before the next batch (same chain rule as V1-V8):
#   V3a capacity (EMBEDDING_DIM x NUM_H_LAYERS on the current actor)
#   V3b learned global context (flag A/B on the current actor)
#   V3c shared node encoder + two heads, concat vs bilinear stage-2
#   V3d logit clipping x learnable temperature (distribution shaping)
# Judge every batch on test min_cost/Gain against the Batch-0 noise floor —
# NOT on the PPO loss, which is not comparable across policy
# parameterisations. V3d is additionally judged on Entropy / Average_KL.
# All eval commands follow the standard pattern:
#   uv run eval/run.py --dataset random --FOLDER <GROUP> --dim 100 --DATA nazari --OUTER_STEPS 10000 --dtype float16 --no-baseline

