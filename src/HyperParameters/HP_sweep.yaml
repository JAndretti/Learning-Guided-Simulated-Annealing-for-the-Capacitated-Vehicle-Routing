# --- V3b: learned global context (flag A/B on the current actor) ------------
#   GLOBAL_CONTEXT concatenates a mean|max|std pooled instance summary g to
#   the input of BOTH scoring stages (same pooling trick as the Deep-Sets
#   critic), so every node's logit can depend on the whole instance — the
#   cheapest fix for the actor's "no learned global context" weakness (one
#   O(N*c) pooling op per SA step; no new structure).
#   -> bake winner into HP.yaml: GLOBAL_CONTEXT.
# - GROUP: [V3b_ctx]
#   MODEL: [seq]
