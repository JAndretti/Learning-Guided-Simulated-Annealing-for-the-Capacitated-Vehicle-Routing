# src/HyperParameters/HP_sweep.yaml
# ============================================================================
# CURRICULUM-LEARNING EVALUATION PROTOCOL (from scratch)
# ============================================================================
# Goal: evaluate the curriculum parameters for the paper, assuming NOTHING has
# been measured yet. Full factorial over {CL_TYPE, MAX_OUTER_STEPS_CL,
# MAX_PROB_STEP, STEEP_SIG} x seeds is too expensive, so this is a SEQUENTIAL
# (coordinate-descent) protocol: each batch fixes the winner of the previous
# one. This is greedy and assumes the parameters are roughly separable; the
# sensitivity batches (3-5) and the final confirmation batch (7) guard against
# that assumption being wrong.
#
# HOW TO RUN
#   * Exactly ONE batch is uncommented at a time (Batch 0 below is active).
#   * LAUNCHER RULE: every uncommented group must list the EXACT same keys.
#   * After a batch finishes, evaluate its checkpoints (eval/run.py) and pick
#     the lowest MEAN final_cost across seeds; write that value into the
#     "<-- FIX from Batch N" placeholders of the next batch, then uncomment it.
#
# CONVENTIONS (held constant unless a batch is sweeping them)
#   PPO_EPOCHS: 5            (matches the production setting)
#   TEST_OUTER_STEPS: 5000   (pinned -> avoids the model-selection confound)
#   N_EPOCHS: HP.yaml default (1000)
#   Significance: trust a difference only if mean gap > ~1e-2 routing units
#     (the run-to-run noise floor measured in Batch 0).
#   Seeds: exploratory batches use 3 seeds; gate/confirmation use 5.
# ============================================================================


# --- BATCH 0 (ACTIVE): baseline + noise floor -------------------------------
#   Run the no-CL baseline across seeds. Read: baseline mean +/- std. The std
#   here IS your empirical significance threshold for every later comparison.
- GROUP: [P0_baseline]
  CL: [false]
  CL_TYPE: [sig]              # ignored when CL=false
  MAX_OUTER_STEPS_CL: [500]   # ignored
  MAX_PROB_STEP: [1000]       # ignored
  STEEP_SIG: [0.01]           # ignored
  TEST_OUTER_STEPS: [5000]
  PPO_EPOCHS: [3]
  SEED: [0, 1, 2, 3, 4]


# --- BATCH 1: does curriculum help at all? (go / no-go gate) -----------------
#   CL on (neutral mid-range config) vs off, paired by seed. If CL does not beat
#   Batch 0 by more than the noise floor, stop here and report a null result.
# - GROUP: [P1_CL]
#   CL: [true]
#   CL_TYPE: [sig]
#   MAX_OUTER_STEPS_CL: [500]
#   MAX_PROB_STEP: [1000]
#   STEEP_SIG: [0.01]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2, 3, 4]


# --- BATCH 2: schedule shape — sigmoid vs linear ----------------------------
#   Fix a mid-range warmup; compare the two schedules. Winner -> CL_TYPE below.
# - GROUP: [P2_sig]
#   CL: [true]
#   CL_TYPE: [sig]
#   MAX_OUTER_STEPS_CL: [500]
#   MAX_PROB_STEP: [1000]
#   STEEP_SIG: [0.01]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]
# - GROUP: [P2_lin]
#   CL: [true]
#   CL_TYPE: [lin]
#   MAX_OUTER_STEPS_CL: [500]
#   MAX_PROB_STEP: [1000]
#   STEEP_SIG: [0.01]           # ignored by lin
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]


# --- BATCH 3: warmup strength — MAX_OUTER_STEPS_CL ---------------------------
#   The number of deterministic pre-improvement steps at full curriculum.
#   Sweep low->high on the winning schedule. Winner -> MAX_OUTER_STEPS_CL below.
# - GROUP: [P3_strength]
#   CL: [true]
#   CL_TYPE: [sig]              # <-- FIX from Batch 2
#   MAX_OUTER_STEPS_CL: [100, 250, 500, 1000]
#   MAX_PROB_STEP: [1000]
#   STEEP_SIG: [0.01]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]


# --- BATCH 4: ramp duration — MAX_PROB_STEP ---------------------------------
#   Over how many epochs the warmup ramps from 0 to MAX_OUTER_STEPS_CL.
#   Winner -> MAX_PROB_STEP below.
# - GROUP: [P4_ramp]
#   CL: [true]
#   CL_TYPE: [sig]              # <-- FIX from Batch 2
#   MAX_OUTER_STEPS_CL: [500]   # <-- FIX from Batch 3
#   MAX_PROB_STEP: [500, 1000, 2000]
#   STEEP_SIG: [0.01]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]


# --- BATCH 5: sigmoid steepness — STEEP_SIG (only if sig won Batch 2) --------
#   Controls how sharp the sigmoid ramp is. Skip if linear won. Winner -> below.
# - GROUP: [P5_steep]
#   CL: [true]
#   CL_TYPE: [sig]
#   MAX_OUTER_STEPS_CL: [500]   # <-- FIX from Batch 3
#   MAX_PROB_STEP: [1000]       # <-- FIX from Batch 4
#   STEEP_SIG: [0.005, 0.01, 0.05]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]


# --- BATCH 6: mechanism ablation — is it the RAMP or just the warmup? --------
#   Same warmup budget, constant vs ramped. "const" uses a tiny MAX_PROB_STEP so
#   t_init saturates to MAX_OUTER_STEPS_CL within a few epochs. EARLY_STOP_AFTER
#   decouples early stopping from MAX_PROB_STEP so BOTH arms train the same
#   length (set to >= N_EPOCHS to disable early stopping for a clean comparison).
# - GROUP: [P6_const]
#   CL: [true]
#   CL_TYPE: [lin]
#   MAX_OUTER_STEPS_CL: [500]   # <-- FIX from Batch 3
#   MAX_PROB_STEP: [50]         # fast saturation -> ~constant warmup
#   STEEP_SIG: [0.01]
#   EARLY_STOP_AFTER: [2000]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]
# - GROUP: [P6_ramp]
#   CL: [true]
#   CL_TYPE: [lin]
#   MAX_OUTER_STEPS_CL: [500]   # <-- FIX from Batch 3
#   MAX_PROB_STEP: [1000]       # <-- FIX from Batch 4
#   STEEP_SIG: [0.01]
#   EARLY_STOP_AFTER: [2000]
#   TEST_OUTER_STEPS: [5000]
#   PPO_EPOCHS: [3]
#   SEED: [0, 1, 2]


